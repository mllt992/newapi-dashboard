services:
  redis:
    image: redis:7-alpine
    container_name: newapi-data-redis
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-123456}", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: newapi-data-app
    depends_on:
      - redis
    ports:
      - "${APP_PORT:-16302}:3002"
    environment:
      - SQL_DSN=${SQL_DSN}
      - REDIS_CONN_STRING=redis://default:${REDIS_PASSWORD:-123456}@redis:${REDIS_PORT:-6379}
      - PORT=3002
      - QUOTA_PER_UNIT=${QUOTA_PER_UNIT:-500000}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3002/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  redis-data:
