services:
  redis:
    image: redis:7-alpine
    container_name: newapi-data-redis
    command: ["redis-server", "--requirepass", "123456", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: newapi-data-app
    depends_on:
      - redis
    ports:
      - "3002:3002"
    volumes:
      # 挂载真实配置（包含数据库密码等敏感信息）
      - ./env.config.json:/app/env.config.json:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3002/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  redis-data:
